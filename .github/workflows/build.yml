# Every push to a branch other than main: unit tests and a debug build, so a change is known to compile
# before it is merged and tagged. The APK is kept as a workflow artifact for trying it on a TV.
name: Build

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hopla-debug
          path: app/build/outputs/apk/debug/*.apk
