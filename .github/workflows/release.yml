# Pushing a tag such as v0.3 builds, tests, signs and publishes Hopla. The app on the TVs finds the new
# release by itself (hopla-<versionCode>.apk) and offers it from the side menu.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Version and signing key
        env:
          KEYSTORE_B64: ${{ secrets.HOPLA_KEYSTORE_B64 }}
        run: |
          # Above the versionCode 1 of hand-installed builds, and always growing.
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hopla.keystore"

      - name: Test and build
        env:
          HOPLA_KEYSTORE: ${{ runner.temp }}/hopla.keystore
          HOPLA_KEYSTORE_PASSWORD: ${{ secrets.HOPLA_KEYSTORE_PASSWORD }}
          HOPLA_KEY_ALIAS: ${{ secrets.HOPLA_KEY_ALIAS }}
          HOPLA_KEY_PASSWORD: ${{ secrets.HOPLA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "hopla-$VERSION_CODE.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: hopla-*.apk
